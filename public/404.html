<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting • Agent Theories</title>
    <script>
      (function () {
        var base = '/Agent-Theories/';
        var path = window.location.pathname;
        if (!path.startsWith(base)) {
          window.location.replace(base);
          return;
        }
        window.location.replace(base + '#!' + path.slice(base.length) + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Agent Theories…</p>
    <p><a href="/Agent-Theories/">Open Agent Theories</a></p>
  </body>
</html>
